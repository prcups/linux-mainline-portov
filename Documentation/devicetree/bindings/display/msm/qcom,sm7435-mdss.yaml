%YAML 1.2
---
$id: http://devicetree.org/schemas/display/msm/qcom,sm7435-mdss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM7435 Display MDSS

maintainers:
  - SignKirigami <prcups@krgm.moe>

description:
  SM7435 MDSS containing the DPU, DSI controller and 5nm DSI PHY.

properties:
  compatible:
    const: qcom,sm7435-mdss

  reg:
    maxItems: 1

  reg-names:
    const: mdss

  interrupts:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 1

  "#address-cells": true
  "#size-cells": true
  ranges: true

  clocks:
    items:
      - description: Display AHB
      - description: Display HF AXI
      - description: Display core

  clock-names:
    items:
      - const: iface
      - const: bus
      - const: core

  interconnects:
    maxItems: 3

  interconnect-names:
    maxItems: 3

patternProperties:
  "^display-controller@[0-9a-f]+$":
    type: object
    additionalProperties: true
    properties:
      compatible:
        const: qcom,sm7435-dpu

  "^dsi@[0-9a-f]+$":
    type: object
    additionalProperties: true
    properties:
      compatible:
        items:
          - const: qcom,sm7435-dsi-ctrl
          - const: qcom,mdss-dsi-ctrl

  "^phy@[0-9a-f]+$":
    type: object
    additionalProperties: true
    properties:
      compatible:
        const: qcom,sm7435-dsi-phy-5nm

required:
  - compatible

unevaluatedProperties: false
