%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/boe,icnl9922c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: BOE/CSOT ICNL9922C 1080x2400 DSC MIPI DSI panel

maintainers:
  - SignKirigami <prcups@krgm.moe>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    enum:
      - boe,icnl9922c
      - csot,icnl9922c

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vddio-supply: true
  lab-supply: true
  ibb-supply: true
  port: true

required:
  - compatible
  - reg
  - reset-gpios
  - vddio-supply
  - lab-supply
  - ibb-supply
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "boe,icnl9922c";
            reg = <0>;

            reset-gpios = <&tlmm 98 GPIO_ACTIVE_HIGH>;
            vddio-supply = <&panel_vddio>;
            lab-supply = <&panel_lab>;
            ibb-supply = <&panel_ibb>;

            port {
                endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };
