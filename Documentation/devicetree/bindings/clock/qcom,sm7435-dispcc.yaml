%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm7435-dispcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Display Clock & Reset Controller on SM7435

maintainers:
  - SignKirigami <prcups@krgm.moe>

description: |
  Qualcomm display clock control module provides clocks, resets and power
  domains on SM7435.

  See also: include/dt-bindings/clock/qcom,sm7435-dispcc.h

properties:
  compatible:
    const: qcom,sm7435-dispcc

  clocks:
    items:
      - description: Board XO source
      - description: Board active XO source
      - description: Display AHB clock source from GCC
      - description: Sleep clock source
      - description: Byte clock from DSI PHY0
      - description: Pixel clock from DSI PHY0

required:
  - compatible
  - clocks
  - '#power-domain-cells'

allOf:
  - $ref: qcom,gcc.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmh.h>
    #include <dt-bindings/clock/qcom,dsi-phy-28nm.h>
    #include <dt-bindings/clock/qcom,sm7435-gcc.h>
    clock-controller@af00000 {
        compatible = "qcom,sm7435-dispcc";
        reg = <0x0af00000 0x20000>;
        clocks = <&rpmhcc RPMH_CXO_CLK>,
                 <&rpmhcc RPMH_CXO_CLK_A>,
                 <&gcc GCC_DISP_AHB_CLK>,
                 <&sleep_clk>,
                 <&dsi0_phy DSI_BYTE_PLL_CLK>,
                 <&dsi0_phy DSI_PIXEL_PLL_CLK>;
        #clock-cells = <1>;
        #reset-cells = <1>;
        #power-domain-cells = <1>;
    };
...
