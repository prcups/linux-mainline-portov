%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm7435-gcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Global Clock & Reset Controller on SM7435

maintainers:
  - SignKirigami <prcups@krgm.moe>

description: |
  Qualcomm global clock control module provides the clocks, resets and power
  domains on SM7435 (Qualcomm codename parrot).

  The controller is register compatible with the SM4450 one, but its clock
  tree is not: it has no GPLL3, no HLOS1 vote clocks and no video/vcodec
  clocks, and it adds the QUPV3 SE5/QSPI0 clocks of both wrappers, the camera
  sleep clock and the video AXI0 clock.  Clock IDs therefore come from
  qcom,sm7435-gcc.h and are not interchangeable with SM4450's.

  See also: include/dt-bindings/clock/qcom,sm7435-gcc.h

properties:
  compatible:
    const: qcom,sm7435-gcc

  clocks:
    items:
      - description: Board XO source
      - description: Sleep clock source
      - description: PCIe 0 pipe clock source
      - description: UFS Phy Rx symbol 0 clock source
      - description: UFS Phy Rx symbol 1 clock source
      - description: UFS Phy Tx symbol 0 clock source
      - description: USB3 Phy wrapper pipe clock source

  clock-names:
    items:
      - const: bi_tcxo
      - const: sleep_clk
      - const: pcie_0_pipe_clk
      - const: ufs_phy_rx_symbol_0_clk
      - const: ufs_phy_rx_symbol_1_clk
      - const: ufs_phy_tx_symbol_0_clk
      - const: usb3_phy_wrapper_gcc_usb30_pipe_clk

required:
  - compatible
  - clocks
  - clock-names
  - '#power-domain-cells'

allOf:
  - $ref: qcom,gcc.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmh.h>
    clock-controller@100000 {
      compatible = "qcom,sm7435-gcc";
      reg = <0x00100000 0x001f4200>;
      clocks = <&rpmhcc RPMH_CXO_CLK>, <&sleep_clk>,
               <&pcie_0_pipe_clk>, <&ufs_mem_phy 0>, <&ufs_mem_phy 1>,
               <&ufs_mem_phy 2>, <&usb_1_qmpphy>;
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
    };

...
