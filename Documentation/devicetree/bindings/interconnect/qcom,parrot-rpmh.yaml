%YAML 1.2
---
$id: http://devicetree.org/schemas/interconnect/qcom,parrot-rpmh.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm RPMh Network-On-Chip Interconnect on SM7435

maintainers:
  - SignKirigami <prcups@krgm.moe>

description: |
  RPMh interconnect providers on SM7435 (parrot) communicate bandwidth
  requests through Bus Clock Managers (BCMs) using the applications RSC.

properties:
  compatible:
    enum:
      - qcom,parrot-aggre1-noc
      - qcom,parrot-aggre2-noc
      - qcom,parrot-clk-virt
      - qcom,parrot-cnoc2
      - qcom,parrot-cnoc3
      - qcom,parrot-gem-noc
      - qcom,parrot-lpass-ag-noc
      - qcom,parrot-mc-virt
      - qcom,parrot-mmss-noc
      - qcom,parrot-nsp-noc
      - qcom,parrot-pcie-anoc
      - qcom,parrot-system-noc

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 2

required:
  - compatible

allOf:
  - $ref: qcom,rpmh-common.yaml#

  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,parrot-clk-virt
              - qcom,parrot-mc-virt
    then:
      properties:
        reg: false
    else:
      required:
        - reg

  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,parrot-pcie-anoc
    then:
      properties:
        clocks:
          items:
            - description: PCIe AXI clock
            - description: PCIe ANOC AHB clock

  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,parrot-aggre1-noc
    then:
      properties:
        clocks:
          items:
            - description: USB3 primary AXI clock

  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,parrot-aggre2-noc
    then:
      properties:
        clocks:
          items:
            - description: SDCC2 AHB clock

  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,parrot-aggre1-noc
              - qcom,parrot-aggre2-noc
              - qcom,parrot-pcie-anoc
    then:
      required:
        - clocks
    else:
      properties:
        clocks: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,sm7435-gcc.h>

    interconnect-0 {
        compatible = "qcom,parrot-clk-virt";
        #interconnect-cells = <1>;
        qcom,bcm-voters = <&apps_bcm_voter>;
    };

    interconnect@16e0000 {
        compatible = "qcom,parrot-aggre1-noc";
        reg = <0x016e0000 0x1c080>;
        #interconnect-cells = <1>;
        clocks = <&gcc GCC_AGGRE_USB3_PRIM_AXI_CLK>;
        qcom,bcm-voters = <&apps_bcm_voter>;
    };
...
