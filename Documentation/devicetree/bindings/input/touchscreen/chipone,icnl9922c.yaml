%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/chipone,icnl9922c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Chipone ICNL9922C SPI touchscreen controller

maintainers:
  - SignKirigami <prcups@krgm.moe>

description: |
  The controller uses the Chipone TCS protocol over mode 0 SPI. Firmware is
  downloaded into volatile SRAM. The firmware must match the panel assembly.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: chipone,icnl9922c

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 6000000

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  firmware-name:
    description: Panel-specific firmware downloaded into controller SRAM.
    maxItems: 1

required:
  - compatible
  - reg
  - spi-max-frequency
  - interrupts
  - reset-gpios
  - firmware-name

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "chipone,icnl9922c";
            reg = <0>;
            spi-max-frequency = <6000000>;
            interrupt-parent = <&tlmm>;
            interrupts = <65 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&tlmm 131 GPIO_ACTIVE_LOW>;
            firmware-name = "boe_chipone_firmware.bin";
            touchscreen-size-x = <4320>;
            touchscreen-size-y = <9600>;
        };
    };
